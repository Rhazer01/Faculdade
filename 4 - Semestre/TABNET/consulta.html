<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TABNET DATASUS - Filtros e Consulta</title>
    <!-- 1. Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Font Awesome 6 (mesmos ícones da tela de login) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- 3. Fonte Rawline Oficial -->
    <link rel="stylesheet" href="https://cdngovbr-ds.estaleiro.serpro.gov.br/design-system/fonts/rawline/css/rawline.css">
    <!-- 4. Nosso CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white">

    <!-- NAVBAR SUPERIOR DO DATASUS -->
    <header class="bg-white border-bottom shadow-sm">
        <div class="container-fluid px-4 py-2 d-flex justify-content-between align-items-center">

            <!-- Lado Esquerdo: Botão Menu + Títulos -->
            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-light border-0 px-2 py-1" type="button" aria-label="Abrir Menu">
                    <i class="fa-solid fa-bars fs-5" style="color: #1351B4;"></i>
                </button>
                <div>
                    <h1 class="h6 fw-bold mb-0 text-dark">TABNET DATASUS</h1>
                    <span class="text-muted" style="font-size: 0.75rem;">
                        Morbidade Hospitalar do SUS (SIH/SUS) — Por local de internação — São Paulo
                    </span>
                </div>
            </div>

            <!-- Lado Direito: Links de Acesso, Ícones de Utilidade e Perfil -->
            <div class="d-flex align-items-center gap-3">

                <!-- Ícone de Ação/Suporte -->
                <div class="d-flex align-items-center gap-3 border-start ps-3" style="color: #1351B4;">
                    <a href="#" class="text-decoration-none" title="Estatísticas" style="color: #1351B4;"><i class="fa-solid fa-chart-simple"></i></a>
                    <a href="#" class="text-decoration-none" title="Suporte" style="color: #1351B4;"><i class="fa-solid fa-headset"></i></a>
                    <a href="#" class="text-decoration-none" title="Unidades de Saúde" style="color: #1351B4;"><i class="fa-solid fa-hospital"></i></a>
                    <a href="#" class="text-decoration-none" title="Mensagens" style="color: #1351B4;"><i class="fa-solid fa-comment-dots"></i></a>
                    <a href="#" class="text-decoration-none" title="Alto Contraste" style="color: #1351B4;"><i class="fa-solid fa-circle-half-stroke"></i></a>
                </div>

                <!-- Botão de Login / Perfil -->
                <a href="login-gov.html" class="btn btn-outline-primary btn-sm rounded-pill px-3 ms-2 d-flex align-items-center gap-2"
                   style="color: #1351B4; border-color: #1351B4;">
                    <i class="fa-solid fa-user"></i>
                    <span class="fw-medium">Entrar</span>
                </a>
            </div>

        </div>
    </header>

    <!-- CONTEUDO PRINCIPAL (ÁREA DE CONSULTA) -->
     <main class="container my-4">

        <!-- PASSO 1: VÁRIÁVEIS DISPONÍVEIS -->
        <section class="card border border-dark-subtle rounded-0 p-4 mb-4 bg-white shadow-sm">

            <!-- Título do passo -->
            <h2 class="h6 fw-bold mb-3 text-dark">Passo 1: Váriaveis Disponíveis</h2>

            <!-- Grid de 3 colunas (Linha, Coluna e Métrica) -->
             <div class="row g-3">

                <!-- Coluna 1: Linha -->
                 <div class="col-12 col-md-4">
                    <label for="varLinha" class="form-label small fw-semibold text-secondary d-flex align-items-center gap-1">
                        Váriavel da Linha <span class="text-danger">*</span>
                        <i class="fa-regular fa-circle-question text-muted" title="Define o que aparecerá nas linhas da tabela"></i>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <select class="form-select border-start-0" id="varLinha">
                            <option selected>Município (SP)</option>
                            <option value="1">Região de Saúde (CIR)</option>
                            <option value="2">Macrorregião de Saúde</option>
                            <option value="3">Faixa Etária</option>
                            <option value="4">Sexo</option>
                        </select>
                    </div>
                 </div>
                
                 <!-- Coluna 2: Coluna -->
                 <div class="col-12 col-md-4">
                    <label for="varColuna" class="form-label small fw-semibold text-secondary">
                        Variável da Coluna <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <select class="form-select border-start-0" id="varColuna">
                            <option selected>Ano de atendimento</option>
                            <option value="1">Mês de atendimento</option>
                            <option value="2">Faixa Etária</option>
                            <option value="3">Sexo</option>
                            <option value="4">Não ativa</option>
                        </select>
                    </div>
                 </div>
                 
                 <!-- Coluna 3: Métrica / Dado -->
                <div class="col-12 col-md-4">
                    <label for="varMetrica" class="form-label small fw-semibold text-secondary">
                        Dado / Conteúdo (Métrica) <span class="text-danger">*</span>
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted">
                            <i class="fa-solid fa-magnifying-glass"></i>
                        </span>
                        <select class="form-select border-start-0" id="varMetrica">
                            <option selected>Internações (Número Total)</option>
                            <option value="1">AIH pagas</option>
                            <option value="2">Valor total (R$)</option>
                            <option value="3">Média de permanência (dias)</option>
                            <option value="4">Óbitos</option>
                            <option value="5">Taxa de mortalidade</option>
                        </select>
                    </div>
                </div>
             </div>




        </section>
     </main>

</body>
</html>
